<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Flypenguin78 的个人网站 - 欢迎来到我的小站" />
  <title>Flypenguin78 | 个人网站</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --text: #18223a;
      --muted: #5b6b84;
      --accent: #2563eb;
      --accent-2: #7c3aed;
      --border: #e3e9f2;
      --shadow: 0 20px 45px rgba(24, 34, 58, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(37, 99, 235, 0.10), transparent 32rem),
        radial-gradient(circle at 90% 10%, rgba(124, 58, 237, 0.10), transparent 30rem),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 249, 252, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(227, 233, 242, 0.8);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      align-items: center;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .nav-links a {
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 56px;
      padding: 84px 0 72px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.14);
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.4rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
      margin-bottom: 20px;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      color: var(--muted);
      font-size: 1.12rem;
      max-width: 560px;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(37, 99, 235, 0.32);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      border-color: #c9d5e6;
    }

    .hero-art {
      position: relative;
      min-height: 380px;
      display: grid;
      place-items: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .avatar-card {
      width: min(340px, 90%);
      padding: 28px;
      text-align: center;
      position: relative;
      z-index: 2;
      transform: rotate(-2deg);
    }

    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 3rem;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      border: 4px solid #fff;
      box-shadow: 0 8px 22px rgba(24, 34, 58, 0.12);
    }

    .avatar-card h2 {
      font-size: 1.35rem;
      margin-bottom: 5px;
    }

    .avatar-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .badge {
      padding: 5px 11px;
      border-radius: 999px;
      background: #f0f4fa;
      color: #41506b;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .deco {
      position: absolute;
      border-radius: 24px;
      z-index: 1;
    }

    .deco-one {
      width: 130px;
      height: 130px;
      right: 8%;
      top: 5%;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.22), rgba(124, 58, 237, 0.12));
      transform: rotate(12deg);
    }

    .deco-two {
      width: 90px;
      height: 90px;
      left: 4%;
      bottom: 8%;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.18), rgba(37, 99, 235, 0.10));
      transform: rotate(-15deg);
    }

    section {
      padding: 66px 0;
    }

    .section-head {
      text-align: center;
      max-width: 620px;
      margin: 0 auto 42px;
    }

    .section-head h2 {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .section-head p {
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 22px;
    }

    .three {
      grid-template-columns: repeat(3, 1fr);
    }

    .feature {
      padding: 26px;
    }

    .feature-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      font-size: 1.4rem;
      background: #eef4ff;
    }

    .feature h3 {
      font-size: 1.08rem;
      margin-bottom: 8px;
    }

    .feature p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .projects {
      grid-template-columns: repeat(2, 1fr);
    }

    .project {
      padding: 24px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .project:hover {
      transform: translateY(-4px);
      border-color: #c7d5ea;
      box-shadow: 0 24px 48px rgba(24, 34, 58, 0.12);
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .project-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #f3f0ff;
      font-size: 1.2rem;
    }

    .tag {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      background: #eef4ff;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .project h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }

    .project p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 18px;
    }

    .project a {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
    }

    .contact {
      text-align: center;
      background: linear-gradient(135deg, #0f1c3d, #1d1440);
      color: #fff;
      border-radius: 26px;
      padding: 52px 30px;
      position: relative;
      overflow: hidden;
    }

    .contact::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.25);
      right: -70px;
      bottom: -110px;
    }

    .contact h2 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .contact p {
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 26px;
      position: relative;
      z-index: 1;
    }

    .contact .btn-primary {
      position: relative;
      z-index: 1;
    }

    footer {
      padding: 30px 0 44px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .heart {
      color: #ef4444;
    }

    .contact-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .contact-list .btn {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 840px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 54px 0 48px;
        text-align: center;
      }

      .lead {
        margin-left: auto;
        margin-right: auto;
      }

      .actions {
        justify-content: center;
      }

      .hero-art {
        min-height: 320px;
      }

      .three,
      .projects {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .nav-links a:not(.btn) {
        display: none;
      }
    }
  
    button.btn {
      font-family: inherit;
    }

    .delete-btn {
      margin-left: auto;
      padding: 5px 10px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff;
      color: #dc2626;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .delete-btn:hover {
      background: #dc2626;
      color: #fff;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 28, 61, 0.45);
      display: grid;
      place-items: center;
      z-index: 50;
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 26px;
      width: min(360px, calc(100% - 40px));
      box-shadow: 0 24px 60px rgba(15, 28, 61, 0.25);
    }

    .modal h2 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .delete-error {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 10px;
    }


    .project-open {
      width: 100%;
      margin-top: 4px;
    }

    .project-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .note-btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #eef4ff;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .note-btn:hover {
      border-color: #c7d5ea;
    }

    .project-note {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: pre-wrap;
    }

    .modal textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 12px;
      resize: vertical;
      font-family: inherit;
    }

    .note-project-name {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px !important;
    }

</style>
</head>
<body>

  <div id="deleteModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <h2 id="deleteModalTitle">删除项目</h2>
      <p>请输入密码确认删除：</p>
      <input type="password" id="deletePassword" placeholder="请输入密码" autocomplete="off" />
      <p id="deleteError" class="delete-error" hidden>密码错误，请重试。</p>
      <div class="modal-actions">
        <button type="button" id="cancelDelete" class="btn btn-secondary">取消</button>
        <button type="button" id="confirmDelete" class="btn btn-danger">确认删除</button>
      </div>
    </div>
  </div>

  <div id="noteModal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
      <h2 id="noteModalTitle">编辑注释</h2>
      <p id="noteProjectName" class="note-project-name"></p>
      <textarea id="noteText" rows="4" placeholder="请输入注释内容"></textarea>
      <input type="password" id="notePassword" placeholder="请输入密码" autocomplete="off" />
      <p id="noteError" class="delete-error" hidden>密码错误，请重试。</p>
      <div class="modal-actions">
        <button type="button" id="cancelNote" class="btn btn-secondary">取消</button>
        <button type="button" id="saveNote" class="btn btn-danger">修改</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var PASSWORD = "03021128";
      var DELETED_KEY = "deletedProjects";
      var NOTES_KEY = "projectNotes";

      function getDeleted() {
        try {
          var raw = localStorage.getItem(DELETED_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveDeleted(items) {
        try {
          localStorage.setItem(DELETED_KEY, JSON.stringify(items));
        } catch (e) {}
      }

      function getNotes() {
        try {
          var raw = localStorage.getItem(NOTES_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }

      function saveNotes(notes) {
        try {
          localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
        } catch (e) {}
      }

      function cardId(card) {
        var heading = card.querySelector("h3");
        return card.getAttribute("data-file") || (heading ? heading.textContent.trim() : "");
      }

      function renderNotes() {
        var notes = getNotes();
        document.querySelectorAll(".card.project").forEach(function (card) {
          var el = card.querySelector(".project-note");
          if (!el) return;
          var value = notes[cardId(card)];
          if (value) {
            el.textContent = "注释：" + value;
            el.hidden = false;
          } else {
            el.textContent = "";
            el.hidden = true;
          }
        });
      }

      function applyDeleted() {
        var deleted = getDeleted();
        document.querySelectorAll(".card.project").forEach(function (card) {
          if (deleted.indexOf(cardId(card)) !== -1) {
            card.remove();
          }
        });
      }

      var deleteModal = document.getElementById("deleteModal");
      var deletePasswordInput = document.getElementById("deletePassword");
      var deleteError = document.getElementById("deleteError");
      var cancelDeleteBtn = document.getElementById("cancelDelete");
      var confirmDeleteBtn = document.getElementById("confirmDelete");

      var noteModal = document.getElementById("noteModal");
      var noteText = document.getElementById("noteText");
      var notePasswordInput = document.getElementById("notePassword");
      var noteError = document.getElementById("noteError");
      var noteProjectName = document.getElementById("noteProjectName");
      var cancelNoteBtn = document.getElementById("cancelNote");
      var saveNoteBtn = document.getElementById("saveNote");

      var pendingDeleteCard = null;
      var pendingNoteCard = null;

      function openDelete(card) {
        pendingDeleteCard = card;
        deletePasswordInput.value = "";
        deleteError.hidden = true;
        deleteModal.hidden = false;
        deletePasswordInput.focus();
      }

      function openNote(card) {
        pendingNoteCard = card;
        noteProjectName.textContent = cardId(card);
        var notes = getNotes();
        noteText.value = notes[cardId(card)] || "";
        notePasswordInput.value = "";
        noteError.hidden = true;
        noteModal.hidden = false;
        noteText.focus();
      }

      document.addEventListener("click", function (event) {
        var deleteButton = event.target.closest(".delete-btn");
        if (deleteButton) {
          var card = deleteButton.closest(".card.project");
          if (card) openDelete(card);
          return;
        }

        var noteButton = event.target.closest(".note-btn");
        if (noteButton) {
          var noteCard = noteButton.closest(".card.project");
          if (noteCard) openNote(noteCard);
        }
      });

      cancelDeleteBtn.addEventListener("click", function () {
        deleteModal.hidden = true;
        pendingDeleteCard = null;
      });

      deleteModal.addEventListener("click", function (event) {
        if (event.target === deleteModal) {
          deleteModal.hidden = true;
          pendingDeleteCard = null;
        }
      });

      confirmDeleteBtn.addEventListener("click", function () {
        if (deletePasswordInput.value !== PASSWORD) {
          deleteError.hidden = false;
          deletePasswordInput.focus();
          deletePasswordInput.select();
          return;
        }
        if (pendingDeleteCard) {
          var id = cardId(pendingDeleteCard);
          var deleted = getDeleted();
          if (deleted.indexOf(id) === -1) deleted.push(id);
          saveDeleted(deleted);
          pendingDeleteCard.remove();
        }
        deleteModal.hidden = true;
        pendingDeleteCard = null;
      });

      deletePasswordInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") confirmDeleteBtn.click();
      });

      cancelNoteBtn.addEventListener("click", function () {
        noteModal.hidden = true;
        pendingNoteCard = null;
      });

      noteModal.addEventListener("click", function (event) {
        if (event.target === noteModal) {
          noteModal.hidden = true;
          pendingNoteCard = null;
        }
      });

      saveNoteBtn.addEventListener("click", function () {
        if (notePasswordInput.value !== PASSWORD) {
          noteError.hidden = false;
          notePasswordInput.focus();
          notePasswordInput.select();
          return;
        }
        if (pendingNoteCard) {
          var id = cardId(pendingNoteCard);
          var notes = getNotes();
          var value = noteText.value.trim();
          if (value) {
            notes[id] = value;
          } else {
            delete notes[id];
          }
          saveNotes(notes);

          var el = pendingNoteCard.querySelector(".project-note");
          if (el) {
            if (value) {
              el.textContent = "注释：" + value;
              el.hidden = false;
            } else {
              el.textContent = "";
              el.hidden = true;
            }
          }
        }
        noteModal.hidden = true;
        pendingNoteCard = null;
      });

      notePasswordInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") saveNoteBtn.click();
      });

      applyDeleted();
      renderNotes();
    })();
  </script>

</body>
</html>
